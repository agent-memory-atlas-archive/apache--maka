[workspace]
exclude = ["third-party/gpui-fast", "third-party/async-io", "third-party/sqlx-sqlite", "third-party/image-webp"]
default-members = ["crates/cli"]
members = [
    "third-party/gpui-kit/crates/base",
    "crates/acp",
    "crates/agent",
    "crates/agent-service",
    "crates/apply-patch",
    "crates/assistant",
    "crates/application-bridge",
    "crates/background-health",
    "crates/cli",
    "crates/config",
    "crates/desktop",
    "crates/computer-use",
    "crates/event-log",
    "crates/external-agent",
    "crates/fs-tools",
    "crates/goal",
    "crates/graph",
    "crates/insights",
    "crates/jev",
    "crates/js-runtime",
    "crates/model",
    "crates/network",
    "crates/plugins",
    "crates/plugin-core",
    "crates/presentation",
    "crates/process",
    "crates/providers",
    "crates/responses",
    "crates/runtime",
    "crates/runtime-host",
    "crates/sandbox",
    "crates/scheduler",
    "crates/settings-service",
    "crates/session-import",
    "crates/session-recap",
    "crates/session-title",
    "crates/skills",
    "crates/tool-catalog",
    "crates/tools",
    "crates/tui",
    "crates/ui",
    "crates/ui-gpui",
    "crates/web",
    "crates/workhub",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "29c04574dc838a8e59e84c9c9f3c4d15983222ce", default-features = false, features = ["gpui-fast"] }
maka-application-bridge = { path = "crates/application-bridge" }
cua-driver-sdk = { git = "https://github.com/maka-agent/cua", rev = "79c9b58a1b61f66ae966635c464e54cb2c8151d6" }
cua-driver-contract = { git = "https://github.com/maka-agent/cua", rev = "79c9b58a1b61f66ae966635c464e54cb2c8151d6" }
agent-client-protocol = { version = "2.2.0", default-features = false, features = ["unstable_protocol_v2"] }
apply-patch = { path = "crates/apply-patch" }
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
deno_core = "=0.411.0"
deno_error = "0.7"
fastrand = "2"
futures-util = { version = "0.3", features = ["sink"] }
gix = { version = "=0.87.1", default-features = false, features = ["sha1", "sha256"] }
imagesize = { version = "=0.15.0", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
jsonschema = { version = "0.56.0", default-features = false }
libc = "0.2"
maka-acp = { path = "crates/acp" }
maka-agent = { path = "crates/agent" }
maka-agent-service = { path = "crates/agent-service" }
maka-assistant = { path = "crates/assistant" }
maka-background-health = { path = "crates/background-health" }
maka-config = { path = "crates/config" }
maka-computer-use = { path = "crates/computer-use" }
maka-event-log = { path = "crates/event-log" }
maka-external-agent = { path = "crates/external-agent" }
maka-fs-tools = { path = "crates/fs-tools" }
maka-goal = { path = "crates/goal" }
maka-graph = { path = "crates/graph" }
maka-insights = { path = "crates/insights" }
maka-jev = { path = "crates/jev" }
maka-js-runtime = { path = "crates/js-runtime" }
maka-model = { path = "crates/model" }
maka-network = { path = "crates/network" }
maka-plugins = { path = "crates/plugins" }
maka-plugin-core = { path = "crates/plugin-core" }
maka-presentation = { path = "crates/presentation" }
maka-process = { path = "crates/process" }
maka-providers = { path = "crates/providers" }
maka-responses = { path = "crates/responses" }
maka-runtime = { path = "crates/runtime" }
maka-runtime-host = { path = "crates/runtime-host" }
maka-sandbox = { path = "crates/sandbox" }
maka-scheduler = { path = "crates/scheduler" }
maka-settings-service = { path = "crates/settings-service" }
maka-session-import = { path = "crates/session-import" }
maka-session-recap = { path = "crates/session-recap" }
maka-session-title = { path = "crates/session-title" }
maka-skills = { path = "crates/skills" }
maka-tool-catalog = { path = "crates/tool-catalog" }
maka-tools = { path = "crates/tools" }
maka-tui = { path = "crates/tui" }
maka-ui = { path = "crates/ui" }
maka-ui-gpui = { path = "crates/ui-gpui" }
maka-web = { path = "crates/web" }
maka-workhub = { path = "crates/workhub" }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "socks"] }
rusqlite = { version = "0.39", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal", "io-util"] }
tokio-tungstenite = "0.29"
tokio-util = { version = "0.7", features = ["rt"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
sys-locale = "0.3.2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
# Keep useful backtraces without embedding hundreds of MiB of dependency types.
debug = "line-tables-only"
# The interactive product hashes packages and composes JSON scenes in Rust.
# Keep ordinary `cargo run` responsive while retaining debug checks/backtraces.
opt-level = 1

[patch.crates-io]
image-webp = { path = "third-party/image-webp" }
sqlx-sqlite = { path = "third-party/sqlx-sqlite" }
async-io = { path = "third-party/async-io" }

gpui-fast = { path = "third-party/gpui-fast/crates/gpui" }
gpui-fast-macos = { path = "third-party/gpui-fast/crates/gpui_macos" }
gpui-fast-windows = { path = "third-party/gpui-fast/crates/gpui_windows" }
gpui-fast-linux = { path = "third-party/gpui-fast/crates/gpui_linux" }
gpui-pre-scheduler = { path = "third-party/gpui-fast/crates/scheduler" }

[patch."https://github.com/longbridge/gpui-kit"]
gpui-base = { path = "third-party/gpui-kit/crates/base" }
