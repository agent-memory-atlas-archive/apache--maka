[package]
name = "maka-render-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
maka-packages.workspace = true
maka-capabilities.workspace = true
maka-ui-runtime.workspace = true
maka-plugin-core.workspace = true
base64 = "0.22.1"
uuid.workspace = true
maka-event-log.workspace = true
maka-transport.workspace = true
ratatui.workspace = true
pulldown-cmark.workspace = true
apply-patch.workspace = true
similar = "3.2.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
# Level-triggered Unix input retains unread keys when SIGWINCH is also ready.
# The default mio source can return a resize while dropping the other readiness.
crossterm = { workspace = true, features = ["use-dev-tty", "event-stream"] }
futures-util.workspace = true
tokio.workspace = true
serde_json.workspace = true
schemars.workspace = true
libc.workspace = true
unicode-segmentation.workspace = true
unicode-linebreak = "0.1.5"
unicode-width.workspace = true
url = "2.5.8"
image = { version = "0.25", default-features = false, features = ["png", "tiff", "bmp"] }

[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
clipboard-rs = { version = "0.3.5", features = ["wayland"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"

[dev-dependencies]
serde.workspace = true
maka-ui-js.workspace = true

tempfile.workspace = true
tokio-util.workspace = true
tokio = { workspace = true, features = ["test-util"] }

# Counter test fixtures include serde derives from ui-js.
[package.metadata.cargo-machete]
ignored = ["serde"]
